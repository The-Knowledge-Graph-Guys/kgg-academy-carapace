name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch: # allows manual running on GitHub Actions

# Least privilege by default; jobs that need more declare it themselves.
permissions:
    contents: read

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10

            - name: Install Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Type check
              run: pnpm check

            - name: Run tests
              run: pnpm test

    build:
        needs: test
        runs-on: ubuntu-latest
        permissions:
            contents: write # semantic-release creates tags and releases
            pages: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10

            - name: Install Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # A failed release must not block deploying the site to students; the
            # header then shows the last tag (or 0.0.0 if none can be found).
            - name: Semantic Release
              continue-on-error: true
              run: pnpm semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # VERSION is read by vite.config.ts (process.env.VERSION) during the
            # Build step below, so this step and Build must stay in the same job.
            - name: Set Version from Tag
              run: echo "VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo '0.0.0')" >> $GITHUB_ENV

            - name: Setup Pages
              uses: actions/configure-pages@v6
              with:
                  static_site_generator: sveltekit

            - name: Build
              run: pnpm run build

            - name: Upload Artifacts
              uses: actions/upload-pages-artifact@v5
              with:
                  path: "build/" # match the "pages" option in adapter-static options

    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy
              id: deployment
              uses: actions/deploy-pages@v5
